<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <marker id="arph" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f38c5"/>
    </marker>
  </defs>
  <!-- Phase boxes -->
  <!-- Phase 1 -->
  <rect x="20" y="60" width="200" height="200" rx="10" fill="#1f38c5" opacity="0.12" stroke="#1f38c5" stroke-width="2"/>
  <rect x="20" y="60" width="200" height="36" rx="10" fill="#1f38c5"/>
  <text x="120" y="83" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Phase 1</text>
  <text x="120" y="116" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Commitment &amp;</text>
  <text x="120" y="134" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Challenge Reservation</text>
  <text x="120" y="162" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Merkle tree of N query pairs</text>
  <text x="120" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Commit benchmark B, τ</text>
  <text x="120" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Lock deposits</text>
  <text x="120" y="216" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Coin-flip → split queries</text>
  <text x="120" y="234" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">  pre / post</text>

  <!-- Arrow 1→2 -->
  <line x1="228" y1="160" x2="258" y2="160" stroke="#1f38c5" stroke-width="2.5" marker-end="url(#arph)"/>

  <!-- Phase 2 -->
  <rect x="260" y="60" width="200" height="200" rx="10" fill="#8e44ad" opacity="0.12" stroke="#8e44ad" stroke-width="2"/>
  <rect x="260" y="60" width="200" height="36" rx="10" fill="#8e44ad"/>
  <text x="360" y="83" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Phase 2</text>
  <text x="360" y="116" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Pre-Purchase</text>
  <text x="360" y="134" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Evaluation (2PC)</text>
  <text x="360" y="162" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Reveal pre-purchase queries</text>
  <text x="360" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Server runs model M</text>
  <text x="360" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• 2PC checks B(Ans) ≥ τ</text>
  <text x="360" y="216" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Output: single bit b</text>
  <text x="360" y="234" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• If b=1: subscribe + pay</text>

  <!-- Arrow 2→3 -->
  <line x1="468" y1="160" x2="498" y2="160" stroke="#1f38c5" stroke-width="2.5" marker-end="url(#arph)"/>

  <!-- Phase 3 -->
  <rect x="500" y="60" width="200" height="200" rx="10" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <rect x="500" y="60" width="200" height="36" rx="10" fill="#27ae60"/>
  <text x="600" y="83" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Phase 3</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Post-Purchase</text>
  <text x="600" y="134" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Accountability</text>
  <text x="600" y="162" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Use post-purchase queries</text>
  <text x="600" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Server returns signed answers</text>
  <text x="600" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Client builds ZK-SNARK</text>
  <text x="600" y="216" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Smart contract arbitrates</text>
  <text x="600" y="234" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">• Refund + slash if fraud</text>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">ASAI Protocol — Three Phases</text>
</svg>