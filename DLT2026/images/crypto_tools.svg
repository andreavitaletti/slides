<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <text x="350" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">Cryptographic Building Blocks</text>

  <!-- Merkle Tree -->
  <rect x="20" y="55" width="155" height="110" rx="8" fill="#3498db" opacity="0.13" stroke="#3498db" stroke-width="2"/>
  <text x="97" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1f38c5">Merkle Tree</text>
  <text x="97" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Commits to N query pairs</text>
  <text x="97" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Proof size: O(log N)</text>
  <text x="97" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Binding: no fake queries</text>
  <text x="97" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">SHA-256 hash function</text>

  <!-- Commitment Scheme -->
  <rect x="190" y="55" width="155" height="110" rx="8" fill="#8e44ad" opacity="0.13" stroke="#8e44ad" stroke-width="2"/>
  <text x="267" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#8e44ad">Commitments</text>
  <text x="267" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Hides B, τ from server</text>
  <text x="267" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Binding: can't switch</text>
  <text x="267" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">benchmark after commit</text>
  <text x="267" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Hiding + Binding</text>

  <!-- 2PC -->
  <rect x="360" y="55" width="155" height="110" rx="8" fill="#e67e22" opacity="0.13" stroke="#e67e22" stroke-width="2"/>
  <text x="437" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e67e22">2PC</text>
  <text x="437" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Evaluates benchmark</text>
  <text x="437" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Output: single bit b</text>
  <text x="437" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Client learns nothing</text>
  <text x="437" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">about model answers</text>

  <!-- ZK-SNARK -->
  <rect x="530" y="55" width="155" height="110" rx="8" fill="#27ae60" opacity="0.13" stroke="#27ae60" stroke-width="2"/>
  <text x="607" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27ae60">ZK-SNARK</text>
  <text x="607" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Proves degradation</text>
  <text x="607" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">without leaking B or τ</text>
  <text x="607" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Succinct on-chain</text>
  <text x="607" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">verification (Groth16)</text>

  <!-- Bottom bar: Smart Contract -->
  <rect x="20" y="185" width="665" height="60" rx="8" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="2"/>
  <text x="352" y="207" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#c0392b">Smart Contract (Blockchain)</text>
  <text x="352" y="228" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Stores commitments · holds deposits · verifies attestations and ZK proofs · issues refunds · slashes collateral</text>

  <!-- Arrows pointing down to SC -->
  <line x1="97" y1="167" x2="97" y2="183" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="267" y1="167" x2="267" y2="183" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="437" y1="167" x2="437" y2="183" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="607" y1="167" x2="607" y2="183" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>