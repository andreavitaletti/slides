<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <marker id="arz" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arzr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2c3e50">ZK-SNARK Complaint Mechanism</text>

  <!-- Three proof components -->
  <rect x="20" y="55" width="175" height="115" rx="8" fill="#3498db" opacity="0.13" stroke="#3498db" stroke-width="2"/>
  <text x="107" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1f38c5">Benchmark Proof</text>
  <text x="107" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Opens C_B, C_τ</text>
  <text x="107" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Checks F1 &lt; τ</text>
  <text x="107" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Verifies Merkle proofs</text>
  <text x="107" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1f38c5">⏱ 6.75 s</text>

  <rect x="215" y="55" width="175" height="115" rx="8" fill="#8e44ad" opacity="0.13" stroke="#8e44ad" stroke-width="2"/>
  <text x="302" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#8e44ad">IVC Steps (×N)</text>
  <text x="302" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Per query: Merkle +</text>
  <text x="302" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">EdDSA signature verify</text>
  <text x="302" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Pipelined with server</text>
  <text x="302" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#8e44ad">⏱ ~21.5 s / step</text>

  <rect x="410" y="55" width="175" height="115" rx="8" fill="#27ae60" opacity="0.13" stroke="#27ae60" stroke-width="2"/>
  <text x="497" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27ae60">Aggregation (Groth16)</text>
  <text x="497" y="96" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Recursively composes</text>
  <text x="497" y="113" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">benchmark + IVC proofs</text>
  <text x="497" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Single succinct proof</text>
  <text x="497" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27ae60">⏱ 26.15 s</text>

  <!-- Arrows to result -->
  <line x1="107" y1="172" x2="107" y2="210" stroke="#3498db" stroke-width="1.5" marker-end="url(#arz)" stroke-dasharray="5,3"/>
  <line x1="302" y1="172" x2="302" y2="210" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arz)" stroke-dasharray="5,3"/>
  <line x1="497" y1="172" x2="497" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arz)" stroke-dasharray="5,3"/>

  <!-- Result box -->
  <rect x="20" y="212" width="665" height="58" rx="8" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="352" y="234" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a7a3c">π_complaint submitted on-chain</text>
  <text x="352" y="256" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Smart contract verifies → if valid: refund client + slash server deposit</text>

  <!-- Total time note -->
  <text x="610" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Total ≈ 7.7 min (20 queries)</text>
  <text x="610" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Peak RAM: 8.6 GB</text>
</svg>